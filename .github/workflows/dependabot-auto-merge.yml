name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge
        run: |
          PR=$(gh pr list --state open --head "${{ github.event.workflow_run.head_branch }}" --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            gh pr merge --auto --squash "$PR" || gh pr merge --squash "$PR"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
